name: Deploy Node App to Azure Container Apps

on:
push:
branches:
- main
workflow_dispatch:

jobs:
build-and-deploy:
runs-on: ubuntu-latest

permissions:
  id-token: write
  contents: read

steps:
  # 1. Checkout code
  - name: Checkout code
    uses: actions/checkout@v3

  # 2. Login ke Azure
  - name: Azure Login
    uses: azure/login@v2
    with:
      client-id: ${{ secrets.MYAZUREAPPNIM_AZURE_CLIENT_ID }}
      tenant-id: ${{ secrets.MYAZUREAPPNIM_AZURE_TENANT_ID }}
      subscription-id: ${{ secrets.MYAZUREAPPNIM_AZURE_SUBSCRIPTION_ID }}

  # 3. Build & Deploy ke Container Apps + ACR
  - name: Build and Deploy
    uses: azure/container-apps-deploy-action@v2
    with:
      appSourcePath: ${{ github.workspace }}

      # 🔥 ACR LU
      registryUrl: nimregistry.azurecr.io
      registryUsername: ${{ secrets.MYAZUREAPPNIM_REGISTRY_USERNAME }}
      registryPassword: ${{ secrets.MYAZUREAPPNIM_REGISTRY_PASSWORD }}

      # 🔥 CONTAINER APP
      containerAppName: myazureapp-nim
      resourceGroup: ContainerGroup_NIM

      # 🔥 IMAGE NAME (WAJIB BENER)
      imageToBuild: nimregistry.azurecr.io/myazureapp-nim:${{ github.sha }}

      # 🔥 NETWORK
      targetPort: 8080
      ingress: external

